# Configuración de Cloudflare Workers (web estática + API del ranking)
# name tiene que coincidir con el nombre del proyecto en Cloudflare
name = "planes"
main = "functions/worker.js"
compatibility_date = "2026-10-01"

# Ficheros de la web; lo que no sea un fichero (por ejemplo /api/ranking) lo responde el Worker
[assets]
directory = "./public"
binding = "ASSETS"

# Base de datos del ranking
[[d1_databases]]
binding = "DB"
database_name = "planes"
database_id = "3d292767-8ed3-498a-a859-28a7f25458c1"